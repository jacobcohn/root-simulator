name: Deploy WebAssembly site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.10

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Configure CMake for WebAssembly
        run: emcmake cmake -S . -B build-web -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-web --config Release --parallel

      - name: Collect static site files
        run: |
          mkdir -p site
          cp build-web/index.html site/
          cp build-web/root_simulator.js site/
          cp build-web/root_simulator.wasm site/
          test -f site/index.html
          test -f site/root_simulator.js
          test -f site/root_simulator.wasm

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
