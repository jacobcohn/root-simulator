<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Root Simulator</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0a0c12;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      outline: none;
      background: #0a0c12;
    }
  </style>
</head>
<body>
  <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
  <script>
    window.Module = {
      canvas: document.getElementById('canvas'),
      print: (...args) => console.log(...args),
      printErr: (...args) => console.error(...args)
    };
  </script>
  <script src="root_simulator.js"></script>
</body>
</html>
